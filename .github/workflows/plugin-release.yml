# v로 시작하는 태그(예: v1.0.0)를 올리면 플러그인을 빌드해
# figma-naming-plugin.zip을 GitHub Release에 첨부합니다.
name: Plugin release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:plugin
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" figma-naming-plugin.zip \
            --title "Figma Naming 플러그인 $GITHUB_REF_NAME" \
            --notes "figma-naming-plugin.zip을 받아 압축을 풀고, Figma 데스크톱 앱에서 Plugins → Development → Import plugin from manifest…로 manifest.json을 선택하세요."
